aid: amazon-codeguru-reviewer
name: Amazon CodeGuru Reviewer
description: >-
  Amazon CodeGuru Reviewer is an automated code review service that uses machine learning and AWS best practices to
  identify security vulnerabilities, bugs, and hard-to-detect issues in your Java and Python code. It provides
  intelligent recommendations to help improve code quality and find defects that may be difficult to detect through
  manual code reviews.
