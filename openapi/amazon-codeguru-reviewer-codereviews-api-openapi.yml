servers:
- url: http://codeguru-reviewer.{region}.amazonaws.com
  variables:
    region:
      description: The AWS region
      enum:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - us-gov-west-1
      - us-gov-east-1
      - ca-central-1
      - eu-north-1
      - eu-west-1
      - eu-west-2
      - eu-west-3
      - eu-central-1
      - eu-south-1
      - af-south-1
      - ap-northeast-1
      - ap-northeast-2
      - ap-northeast-3
      - ap-southeast-1
      - ap-southeast-2
      - ap-east-1
      - ap-south-1
      - sa-east-1
      - me-south-1
      default: us-east-1
  description: The CodeGuruReviewer multi-region endpoint
- url: https://codeguru-reviewer.{region}.amazonaws.com
  variables:
    region:
      description: The AWS region
      enum:
      - us-east-1
      - us-east-2
      - us-west-1
      - us-west-2
      - us-gov-west-1
      - us-gov-east-1
      - ca-central-1
      - eu-north-1
      - eu-west-1
      - eu-west-2
      - eu-west-3
      - eu-central-1
      - eu-south-1
      - af-south-1
      - ap-northeast-1
      - ap-northeast-2
      - ap-northeast-3
      - ap-southeast-1
      - ap-southeast-2
      - ap-east-1
      - ap-south-1
      - sa-east-1
      - me-south-1
      default: us-east-1
  description: The CodeGuruReviewer multi-region endpoint
- url: http://codeguru-reviewer.{region}.amazonaws.com.cn
  variables:
    region:
      description: The AWS region
      enum:
      - cn-north-1
      - cn-northwest-1
      default: cn-north-1
  description: The CodeGuruReviewer endpoint for China (Beijing) and China (Ningxia)
- url: https://codeguru-reviewer.{region}.amazonaws.com.cn
  variables:
    region:
      description: The AWS region
      enum:
      - cn-north-1
      - cn-northwest-1
      default: cn-north-1
  description: The CodeGuruReviewer endpoint for China (Beijing) and China (Ningxia)
security:
- hmac: []
tags:
- name: Codereviews
paths:
  /codereviews:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreateCodeReview
      description: Use to create a code review with a CodeReviewType of RepositoryAnalysis. This type of code review analyzes all code under a specified branch in an associated repository. PullRequest code reviews are automatically triggered by a pull request.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCodeReviewResponse'
              examples:
                CreateCodeReview200Example:
                  summary: Default CreateCodeReview 200 response
                  x-microcks-default: true
                  value:
                    CodeReview:
                      Name: example-resource
                      CodeReviewArn: arn:aws:service:us-east-1:123456789012:resource/example
                      RepositoryName: example-resource
                      Owner: '123456789012'
                      ProviderType: '500123'
                      State: example-value
                      StateReason: example-value
                      CreatedTimeStamp: example-value
        '480':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
              examples:
                CreateCodeReview480Example:
                  summary: Default CreateCodeReview 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
              examples:
                CreateCodeReview481Example:
                  summary: Default CreateCodeReview 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                CreateCodeReview482Example:
                  summary: Default CreateCodeReview 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: ConflictException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictException'
              examples:
                CreateCodeReview483Example:
                  summary: Default CreateCodeReview 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
              examples:
                CreateCodeReview484Example:
                  summary: Default CreateCodeReview 484 response
                  x-microcks-default: true
                  value: example-value
        '485':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
              examples:
                CreateCodeReview485Example:
                  summary: Default CreateCodeReview 485 response
                  x-microcks-default: true
                  value: example-value
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - Name
              - RepositoryAssociationArn
              - Type
              properties:
                Name:
                  description: The name of the code review. The name of each code review in your Amazon Web Services account must be unique.
                  type: string
                  pattern: '[a-zA-Z0-9-_]*'
                  minLength: 1
                  maxLength: 100
                RepositoryAssociationArn:
                  description: <p>The Amazon Resource Name (ARN) of the <a href="https://docs.aws.amazon.com/codeguru/latest/reviewer-api/API_RepositoryAssociation.html">RepositoryAssociation</a> object. You can retrieve this ARN by calling <a href="https://docs.aws.amazon.com/codeguru/latest/reviewer-api/API_ListRepositoryAssociations.html">ListRepositoryAssociations</a>.</p> <p>A code review can only be created on an associated repository. This is the ARN of the associated repository.</p>
                  type: string
                  pattern: ^arn:aws[^:\s]*:codeguru-reviewer:[^:\s]+:[\d]{12}:association:[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                  minLength: 1
                  maxLength: 1600
                Type:
                  description: <p>The type of a code review. There are two code review types:</p> <ul> <li> <p> <code>PullRequest</code> - A code review that is automatically triggered by a pull request on an associated repository.</p> </li> <li> <p> <code>RepositoryAnalysis</code> - A code review that analyzes all code under a specified branch in an associated repository. The associated repository is specified using its ARN in <a href="https://docs.aws.amazon.com/codeguru/latest/reviewer-api/API_CreateCodeReview">CreateCodeReview</a>.</p> </li> </ul>
                  type: object
                  properties:
                    RepositoryAnalysis:
                      allOf:
                      - $ref: '#/components/schemas/RepositoryAnalysis'
                      - description: A code review that analyzes all code under a specified branch in an associated repository. The associated repository is specified using its ARN in <a href="https://docs.aws.amazon.com/codeguru/latest/reviewer-api/API_CreateCodeReview">CreateCodeReview</a>.
                    AnalysisTypes:
                      allOf:
                      - $ref: '#/components/schemas/AnalysisTypes'
                      - description: They types of analysis performed during a repository analysis or a pull request review. You can specify either <code>Security</code>, <code>CodeQuality</code>, or both.
                ClientRequestToken:
                  description: Amazon CodeGuru Reviewer uses this value to prevent the accidental creation of duplicate code reviews if there are failures and retries.
                  type: string
                  pattern: ^[\w-]+$
                  minLength: 1
                  maxLength: 64
            examples:
              CreateCodeReviewRequestExample:
                summary: Default CreateCodeReview request
                x-microcks-default: true
                value:
                  Name: example-resource
                  RepositoryAssociationArn: arn:aws:service:us-east-1:123456789012:resource/example
                  Type:
                    RepositoryAnalysis: example-value
                    AnalysisTypes: STANDARD
                  ClientRequestToken: example-value
      summary: Amazon CodeGuru Reviewer Create Code Review
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Codereviews
  /codereviews/{CodeReviewArn}:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: DescribeCodeReview
      description: Returns the metadata associated with the code review along with its status.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeCodeReviewResponse'
              examples:
                DescribeCodeReview200Example:
                  summary: Default DescribeCodeReview 200 response
                  x-microcks-default: true
                  value:
                    CodeReview: example-value
        '480':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
              examples:
                DescribeCodeReview480Example:
                  summary: Default DescribeCodeReview 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
              examples:
                DescribeCodeReview481Example:
                  summary: Default DescribeCodeReview 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                DescribeCodeReview482Example:
                  summary: Default DescribeCodeReview 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
              examples:
                DescribeCodeReview483Example:
                  summary: Default DescribeCodeReview 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
              examples:
                DescribeCodeReview484Example:
                  summary: Default DescribeCodeReview 484 response
                  x-microcks-default: true
                  value: example-value
      parameters:
      - name: CodeReviewArn
        in: path
        required: true
        description: 'The Amazon Resource Name (ARN) of the <a href="https://docs.aws.amazon.com/codeguru/latest/reviewer-api/API_CodeReview.html">CodeReview</a> object. '
        schema:
          type: string
          pattern: ^arn:aws[^:\s]*:codeguru-reviewer:[^:\s]+:[\d]{12}:[a-z-]+:[\w-]+$
          minLength: 1
          maxLength: 1600
      summary: Amazon CodeGuru Reviewer Describe Code Review
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Codereviews
  /codereviews#Type:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: ListCodeReviews
      description: Lists all the code reviews that the customer has created in the past 90 days.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCodeReviewsResponse'
              examples:
                ListCodeReviews200Example:
                  summary: Default ListCodeReviews 200 response
                  x-microcks-default: true
                  value:
                    CodeReviewSummaries: example-value
                    NextToken: example-value
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
              examples:
                ListCodeReviews480Example:
                  summary: Default ListCodeReviews 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                ListCodeReviews481Example:
                  summary: Default ListCodeReviews 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
              examples:
                ListCodeReviews482Example:
                  summary: Default ListCodeReviews 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
              examples:
                ListCodeReviews483Example:
                  summary: Default ListCodeReviews 483 response
                  x-microcks-default: true
                  value: example-value
      parameters:
      - name: ProviderTypes
        in: query
        required: false
        description: List of provider types for filtering that needs to be applied before displaying the result. For example, <code>providerTypes=[GitHub]</code> lists code reviews from GitHub.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ProviderType'
          minItems: 1
          maxItems: 3
      - name: States
        in: query
        required: false
        description: '<p>List of states for filtering that needs to be applied before displaying the result. For example, <code>states=[Pending]</code> lists code reviews in the Pending state.</p> <p>The valid code review states are:</p> <ul> <li> <p> <code>Completed</code>: The code review is complete.</p> </li> <li> <p> <code>Pending</code>: The code review started and has not completed or failed.</p> </li> <li> <p> <code>Failed</code>: The code review failed.</p> </li> <li> <p> <code>Deleting</code>: The code review is being deleted.</p> </li> </ul>'
        schema:
          type: array
          items:
            $ref: '#/components/schemas/JobState'
          minItems: 1
          maxItems: 3
      - name: RepositoryNames
        in: query
        required: false
        description: List of repository names for filtering that needs to be applied before displaying the result.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Name'
          minItems: 1
          maxItems: 100
      - name: Type
        in: query
        required: true
        description: The type of code reviews to list in the response.
        schema:
          type: string
          enum:
          - PullRequest
          - RepositoryAnalysis
      - name: MaxResults
        in: query
        required: false
        description: The maximum number of results that are returned per call. The default is 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      - name: NextToken
        in: query
        required: false
        description: If <code>nextToken</code> is returned, there are more results available. The value of <code>nextToken</code> is a unique pagination token for each page. Make the call again using the returned token to retrieve the next page. Keep all other arguments unchanged.
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      summary: Amazon CodeGuru Reviewer List Code Reviews
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Codereviews
  /codereviews/{CodeReviewArn}/Recommendations:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    get:
      operationId: ListRecommendations
      description: Returns the list of all recommendations for a completed code review.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRecommendationsResponse'
              examples:
                ListRecommendations200Example:
                  summary: Default ListRecommendations 200 response
                  x-microcks-default: true
                  value:
                    RecommendationSummaries: example-value
                    NextToken: example-value
        '480':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
              examples:
                ListRecommendations480Example:
                  summary: Default ListRecommendations 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
              examples:
                ListRecommendations481Example:
                  summary: Default ListRecommendations 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                ListRecommendations482Example:
                  summary: Default ListRecommendations 482 response
                  x-microcks-default: true
                  value: example-value
        '483':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
              examples:
                ListRecommendations483Example:
                  summary: Default ListRecommendations 483 response
                  x-microcks-default: true
                  value: example-value
        '484':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
              examples:
                ListRecommendations484Example:
                  summary: Default ListRecommendations 484 response
                  x-microcks-default: true
                  value: example-value
      parameters:
      - name: NextToken
        in: query
        required: false
        description: Pagination token.
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      - name: MaxResults
        in: query
        required: false
        description: The maximum number of results that are returned per call. The default is 100.
        schema:
          type: integer
          minimum: 1
          maximum: 300
      - name: CodeReviewArn
        in: path
        required: true
        description: 'The Amazon Resource Name (ARN) of the <a href="https://docs.aws.amazon.com/codeguru/latest/reviewer-api/API_CodeReview.html">CodeReview</a> object. '
        schema:
          type: string
          pattern: ^arn:aws[^:\s]*:codeguru-reviewer:[^:\s]+:[\d]{12}:[a-z-]+:[\w-]+$
          minLength: 1
          maxLength: 1600
      summary: Amazon CodeGuru Reviewer List Recommendations
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - Codereviews
components:
  schemas:
    BranchDiffSourceCodeType:
      type: object
      required:
      - SourceBranchName
      - DestinationBranchName
      properties:
        SourceBranchName:
          allOf:
          - $ref: '#/components/schemas/BranchName'
          - description: The source branch for a diff in an associated repository.
        DestinationBranchName:
          allOf:
          - $ref: '#/components/schemas/BranchName'
          - description: The destination branch for a diff in an associated repository.
      description: A type of <a href="https://docs.aws.amazon.com/codeguru/latest/reviewer-api/API_SourceCodeType">SourceCodeType</a> that specifies a code diff between a source and destination branch in an associated repository.
    Owner:
      type: string
      pattern: ^\S(.*\S)?$
      minLength: 1
      maxLength: 100
    AccessDeniedException: {}
    RecommendationSummary:
      type: object
      properties:
        FilePath:
          allOf:
          - $ref: '#/components/schemas/FilePath'
          - description: Name of the file on which a recommendation is provided.
        RecommendationId:
          allOf:
          - $ref: '#/components/schemas/RecommendationId'
          - description: The recommendation ID that can be used to track the provided recommendations. Later on it can be used to collect the feedback.
        StartLine:
          allOf:
          - $ref: '#/components/schemas/LineNumber'
          - description: Start line from where the recommendation is applicable in the source commit or source branch.
        EndLine:
          allOf:
          - $ref: '#/components/schemas/LineNumber'
          - description: Last line where the recommendation is applicable in the source commit or source branch. For a single line comment the start line and end line values are the same.
        Description:
          allOf:
          - $ref: '#/components/schemas/Text'
          - description: A description of the recommendation generated by CodeGuru Reviewer for the lines of code between the start line and the end line.
        RecommendationCategory:
          allOf:
          - $ref: '#/components/schemas/RecommendationCategory'
          - description: The type of a recommendation.
        RuleMetadata:
          allOf:
          - $ref: '#/components/schemas/RuleMetadata'
          - description: Metadata about a rule. Rule metadata includes an ID, a name, a list of tags, and a short and long description. CodeGuru Reviewer uses rules to analyze code. A rule's recommendation is included in analysis results if code is detected that violates the rule.
        Severity:
          allOf:
          - $ref: '#/components/schemas/Severity'
          - description: The severity of the issue in the code that generated this recommendation.
      description: Information about recommendations.
    DescribeCodeReviewResponse:
      type: object
      properties:
        CodeReview:
          allOf:
          - $ref: '#/components/schemas/CodeReview'
          - description: Information about the code review.
    RepositoryAnalysis:
      type: object
      properties:
        RepositoryHead:
          allOf:
          - $ref: '#/components/schemas/RepositoryHeadSourceCodeType'
          - description: A <a href="https://docs.aws.amazon.com/codeguru/latest/reviewer-api/API_SourceCodeType">SourceCodeType</a> that specifies the tip of a branch in an associated repository.
        SourceCodeType:
          $ref: '#/components/schemas/SourceCodeType'
      description: A code review type that analyzes all code under a specified branch in an associated repository. The associated repository is specified using its ARN when you call <a href="https://docs.aws.amazon.com/codeguru/latest/reviewer-api/API_CreateCodeReview">CreateCodeReview</a>.
    ListCodeReviewsResponse:
      type: object
      properties:
        CodeReviewSummaries:
          allOf:
          - $ref: '#/components/schemas/CodeReviewSummaries'
          - description: A list of code reviews that meet the criteria of the request.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/NextToken'
          - description: Pagination token.
    RuleTag:
      type: string
      pattern: ^\S(.*\S)?$
      minLength: 1
      maxLength: 50
    BranchName:
      type: string
      minLength: 1
      maxLength: 256
    RuleMetadata:
      type: object
      properties:
        RuleId:
          allOf:
          - $ref: '#/components/schemas/RuleId'
          - description: The ID of the rule.
        RuleName:
          allOf:
          - $ref: '#/components/schemas/RuleName'
          - description: The name of the rule.
        ShortDescription:
          allOf:
          - $ref: '#/components/schemas/ShortDescription'
          - description: A short description of the rule.
        LongDescription:
          allOf:
          - $ref: '#/components/schemas/LongDescription'
          - description: A long description of the rule.
        RuleTags:
          allOf:
          - $ref: '#/components/schemas/RuleTags'
          - description: Tags that are associated with the rule.
      description: Metadata about a rule. Rule metadata includes an ID, a name, a list of tags, and a short and long description. CodeGuru Reviewer uses rules to analyze code. A rule's recommendation is included in analysis results if code is detected that violates the rule.
    Name:
      type: string
      pattern: ^\S[\w.-]*$
      minLength: 1
      maxLength: 100
    SourceCodeArtifactsObjectKey:
      type: string
      pattern: ^\S(.*\S)?$
